<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Saya</title>
  <link rel="stylesheet" href="percobaan.css">
</head>
<body>
  <div class="container">
    <div class="card header">
      <img src="https://via.placeholder.com/100" alt="Foto Profil" class="profile-pic">
      <h1>Nama Anda</h1>
      <p>Web Developer | Designer | Learner</p>
    </div>

    <div class="card">
      <h2>Pelajaran Kesukaan</h2>
      <table>
        <tr>
          <th>No</th>
          <th>Pelajaran</th>
          <th>Alasan Suka</th>
        </tr>
        <tr>
          <td>1</td>
          <td>Matematika</td>
          <td>Melatih logika dan ketelitian</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Bahasa Arab</td>
          <td>Menambah wawasan tentang Islam</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Informatika</td>
          <td>Mempelajari teknologi dan pemrograman</td>
        </tr>
      </table>
    </div>

    <div class="card">
      <h2>Contact Me</h2>
      <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama anda" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Masukkan email anda" required>

        <label for="pesan">Pesan:</label>
        <textarea id="pesan" name="pesan" rows="4" placeholder="Tulis pesan anda di sini..." required></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
    </div>
  </div>
</body>
</html>
