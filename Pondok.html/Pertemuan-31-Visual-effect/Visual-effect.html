<!DOCTYPE html>
<html lang="en">
<head>
    <title>Belajar Visual Effect</title>
    <style>
     a:hover {
        color: red;
     }
     p::first-letter {
        font-size: 24px;
        color: blue;
     }
     button {
        background-color: #4caf50;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
     }
     button:hover {
        background-color: #2e7d32;
     }
     .card {
        width: 120px;
        height: 120px;
        background-color: #ffd54f;
        display: grid;
        place-items: center;
        border-radius: 12px;
        transition: transform 0.25s ease-out;
     }
     .card:hover {
        transform: scale(1.07);
     }
     .box {
        width: 60px;
        height: 60px;
        background-color: #29b6f6;
        transition: margin-left 1s linear;
     }
     .box.ease {
         transition-timing-function: ease;
     }
     .box.easein {
       transition-timing-function: ease-in;
     }
     .box.easeout {
        transition-timing-function:ease-out;
     }
     .box.box.easeinout {
        transition-timing-function: ease-in-out;
     }
     .box:hover {
        margin-left: 120px;
     }
     .jalan {
        position: relative;
        animation: geser 2s ease-in-out infinite alternate;
     }
     @keyframes geser {
        from { 
            left: 0; opacity: 0.4;
        }
        to {
            left: 120px; opacity: 1;
        }
     }
     .pulse {
        background-color: #ff6f61;
        color: white;
        border: 0;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        animation: pulse 1.2s ease-in-out infinite;
     }
     @keyframes pulse {
        0% {
            transform: scale(1);
            box-shadow: 0 0 0 0 rgba(255, 111, 97,.6);
        }
        70% {
            transform: scale(1.06);
            box-shadow: 0 0 0 0 rgba(255, 111, 97,.0);
        }
        100% {
            transform: scale(1);
        }
     }
     .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #eee;
        border-top-color: #42a5f5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
     }
     @keyframes spin {
        to {
            transform: rotate(360deg);
        }
     }
     .Kartu {
        width: 160px;
        height: 120px;
        display: grid;
        place-items: center;
        background-color: #fff3cd;
        border-radius: 16px;
        box-shadow: 0 0 0 rgba(293, 193, 7, 0);
        transition: transform 0.25s ease, box-shadow .25s ease;
     }
     .Kartu:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 20px rgba(255, 197, 7, .45);
     }
    .Badge {
        background-color: #00c853;
        color: #fff;
        padding: 4px 10px;
        border-radius: 999px;
        font: 600 12px/1.2 system-ui;
        animation: pop 1.1s ease-out infinite alternate;
     }
     @keyframes pop {
        from {
            transform: scale(1);
            filter: brightness(1);
        }
        to {
            transform: scale(1.12);
            filter: brightness(1.2);
        }
     }
    </style>    
</head>
<body>
    <a href="#">Zaidan</a>
    <p>Geniova Zaidan Assidiq</p>
    <button>arahkan kursor ke sini</button>
    <div class="card">Kartu</div>
    <div class="box ease">Box</div>
    <div class="box easein">Box</div>
    <div class="box easeout">Box</div>
    <div class="box easeinout">Box</div>
    <h2 class="jalan">WW1</h2>
    <button class="pulse">Mulai</button>
    <div class="spinner"></div>
    <div class="Kartu">CSS fun</div>
    <span class="Badge">NEW</span>
</body>
</html>
